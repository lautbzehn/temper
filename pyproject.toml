[project]
name = "temper-evals"
version = "0.3.0"
description = "Test AI features the way you test code, and know when a difference is real."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dan West" }]
keywords = ["ai", "evals", "evaluation", "llm", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=2.1.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "typing-extensions>=4.16.0",
]

[project.scripts]
temper = "temper.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "temper"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # trailing commas are the formatter's call
    "CPY001",  # one license file covers the repo; no per-file headers
    "D105",    # magic methods explain themselves
    "D107",    # the class docstring covers __init__
    "EM",      # a message inline in raise reads better here
    "TRY003",  # same
]

# "5 cases × 3 trials" is meant: the multiplication sign, not the letter x.
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
"src/temper/cli.py" = ["PLR0913"]  # a command's options are its arguments
"tests/**" = ["D", "PLR2004", "S101", "ANN401"]  # test helpers may take Any

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "temper.graders.Grader",
    "temper.suite.Closed",
]

[tool.mypy]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["temper"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "^\\s*\\.\\.\\.$"]
