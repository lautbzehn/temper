name: Release

# Publishing a GitHub release (not a pre-release) puts the package on PyPI.
# PyPI trusts this workflow through OpenID Connect, so no token is stored anywhere.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and check the package
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: The tag is the package's version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: uv build
      - name: The built package replays the demo with no key
        run: uvx --from dist/*.whl temper demo --out "$RUNNER_TEMP/demo.html"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/temper-evals/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
